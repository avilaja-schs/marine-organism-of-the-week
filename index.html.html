<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explore a featured marine organism with taxonomy, biological facts, and images.">
  <title>Mr. Avila's Marine Organism of the Week</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    :root {
      color-scheme: dark;
      --deep: #000a14;
      --accent: #39d7ff;
      --accent-dark: #00657d;
      --gold: #ffd65a;
      --text: #ffffff;
      --muted: #d8e2ec;
      --card-bg: #051221;
      --box-bg: #0a1f35;
      --img-bg: #020810;
      --focus: #ffffff;
      --danger: #ff8f8f;
      --radius-lg: 2rem;
      --radius-md: 1rem;
      --shadow: 0 1.75rem 4rem rgba(0, 0, 0, 0.5);
    }

    html {
      background: var(--deep);
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: clamp(1.5rem, 4vw, 3rem) 1rem;
      background:
        radial-gradient(circle at 50% 0%, rgba(0, 210, 255, 0.12), transparent 34rem),
        var(--deep);
      color: var(--text);
      font-family: "DM Sans", system-ui, sans-serif;
    }

    .page-shell {
      width: min(100%, 70rem);
      margin-inline: auto;
    }

    .site-header {
      margin-bottom: 1.75rem;
      text-align: center;
    }

    h1 {
      margin: 0 0 0.75rem;
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(2.1rem, 6vw, 3.3rem);
      line-height: 1.05;
      text-wrap: balance;
    }

    .badge {
      display: inline-flex;
      min-height: 2rem;
      align-items: center;
      justify-content: center;
      padding: 0.35rem 1.1rem;
      border: 2px solid var(--accent);
      border-radius: 999px;
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .card {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(20rem, 0.85fr);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-lg);
      background: var(--card-bg);
      box-shadow: var(--shadow);
    }

    .info-panel {
      display: flex;
      min-width: 0;
      flex-direction: column;
      justify-content: center;
      padding: clamp(1.5rem, 5vw, 3.25rem);
    }

    .common-name {
      margin: 0 0 0.35rem;
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(2.5rem, 6vw, 4rem);
      line-height: 1.02;
      overflow-wrap: anywhere;
    }

    .scientific-name {
      margin: 0 0 2rem;
      color: var(--accent);
      font-size: clamp(1.2rem, 3vw, 1.65rem);
      font-style: italic;
      overflow-wrap: anywhere;
    }

    .tax-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.9rem;
      margin-bottom: 1.25rem;
    }

    .tax-item {
      min-width: 0;
      padding: 0.9rem 1.1rem;
      border-left: 4px solid var(--accent);
      border-radius: var(--radius-md);
      background: var(--box-bg);
    }

    .order-box {
      grid-column: 1 / -1;
    }

    .tax-label,
    .fact-label {
      display: block;
      margin-bottom: 0.35rem;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .tax-label {
      color: var(--accent);
    }

    .tax-val {
      font-size: 1.05rem;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .fact-container {
      padding: 1.3rem;
      border-right: 0.45rem solid var(--gold);
      border-radius: var(--radius-md);
      background: var(--box-bg);
    }

    .fact-label {
      color: var(--gold);
    }

    .fact-body {
      margin: 0;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.17rem);
      line-height: 1.55;
    }

    .img-panel {
      position: relative;
      display: grid;
      min-height: 38rem;
      place-items: center;
      overflow: hidden;
      background: var(--img-bg);
    }

    #orgImage {
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
      transition: opacity 250ms ease;
    }

    #orgImage.is-loaded {
      opacity: 1;
    }

    .loader,
    .image-error {
      position: absolute;
      z-index: 1;
      max-width: 18rem;
      padding: 1rem;
      text-align: center;
    }

    .loader {
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      animation: pulse 1.5s infinite;
    }

    .image-error {
      color: var(--muted);
      line-height: 1.5;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.8rem;
      margin-top: 1.5rem;
    }

    button {
      min-height: 3rem;
      padding: 0.75rem 1.5rem;
      border: 2px solid currentColor;
      border-radius: 999px;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      transition: transform 160ms ease, filter 160ms ease, background 160ms ease;
    }

    .btn-next {
      border-color: var(--accent);
      background: var(--accent);
      color: var(--deep);
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      filter: brightness(1.08);
    }

    button:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 4px;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .status-error {
      border-color: var(--danger);
      color: var(--danger);
    }

    .image-credit {
      position: absolute;
      right: 1rem;
      bottom: 0.75rem;
      left: 1rem;
      z-index: 2;
      margin: 0;
      color: var(--muted);
      font-size: 0.72rem;
      text-align: right;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.95);
    }

    .image-credit a {
      color: inherit;
    }

    .image-credit a:hover {
      color: var(--accent);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 1; }
    }

    @media (max-width: 56rem) {
      .card {
        grid-template-columns: 1fr;
      }

      .img-panel {
        min-height: 22rem;
        order: -1;
      }
    }

    @media (max-width: 34rem) {
      .tax-grid {
        grid-template-columns: 1fr;
      }

      .order-box {
        grid-column: auto;
      }

      .controls {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="page-shell">
    <header class="site-header">
      <h1>Marine Organism of the Week</h1>
      <div class="badge" id="weekBadge" role="status" aria-live="polite">
        Loading organism data…
      </div>
    </header>

    <main>
      <article class="card" aria-labelledby="name">
        <section class="info-panel">
          <h2 class="common-name" id="name">Loading…</h2>
          <p class="scientific-name" id="sci">Please wait</p>

          <div class="tax-grid" aria-label="Taxonomic classification">
            <div class="tax-item">
              <span class="tax-label">Phylum</span>
              <span class="tax-val" id="phylum">—</span>
            </div>
            <div class="tax-item">
              <span class="tax-label">Class</span>
              <span class="tax-val" id="class">—</span>
            </div>
            <div class="tax-item order-box">
              <span class="tax-label">Order</span>
              <span class="tax-val" id="order">—</span>
            </div>
          </div>

          <div class="fact-container">
            <span class="fact-label">Biological Insight</span>
            <p class="fact-body" id="fact">Organism details are loading.</p>
          </div>
        </section>

        <figure class="img-panel">
          <div class="loader" id="loader" role="status">Scanning depths…</div>
          <div class="image-error" id="imageError" hidden>
            An image is not available for this organism.
          </div>
          <img id="orgImage" alt="">
          <p class="image-credit" id="imageCredit" hidden></p>
        </figure>
      </article>

      <nav class="controls" aria-label="Organism controls">
        <button id="currentButton" type="button">Current Week</button>
        <button id="randomButton" class="btn-next" type="button">Random Discovery</button>
      </nav>

      <p class="sr-only" id="announcer" role="status" aria-live="polite"></p>

      <noscript>
        <p style="margin-top: 1.5rem; text-align: center; color: var(--gold);">
          This page needs JavaScript enabled to load the organism list.
        </p>
      </noscript>
    </main>
  </div>

  <script>
    "use strict";

    const SHEET_ID = "1b6_CRqZEr_Y3VFvrd8FQZqk9P5tHx7DNogAlf0n8J-g";
    const SHEET_GID = "2146260773";
    const ROTATION_START = "2025-08-11";

    const DATA_URL =
      `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq` +
      `?tqx=out:json&headers=1&gid=${SHEET_GID}`;

    const PLACEHOLDER_IMAGE =
      "data:image/svg+xml;charset=utf-8," +
      encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">' +
        '<rect width="800" height="600" fill="#020810"/>' +
        '<g fill="none" stroke="#39d7ff" stroke-opacity=".28" stroke-width="4">' +
        '<path d="M0 320q100-48 200 0t200 0 200 0 200 0"/>' +
        '<path d="M0 380q100-48 200 0t200 0 200 0 200 0"/>' +
        '<path d="M0 440q100-48 200 0t200 0 200 0 200 0"/>' +
        '</g>' +
        '<text x="400" y="235" text-anchor="middle" fill="#d8e2ec" ' +
        'font-family="system-ui,sans-serif" font-size="30">No photo available</text>' +
        '</svg>'
      );

    const elements = {
      badge: document.querySelector("#weekBadge"),
      name: document.querySelector("#name"),
      scientificName: document.querySelector("#sci"),
      phylum: document.querySelector("#phylum"),
      className: document.querySelector("#class"),
      order: document.querySelector("#order"),
      fact: document.querySelector("#fact"),
      image: document.querySelector("#orgImage"),
      loader: document.querySelector("#loader"),
      imageError: document.querySelector("#imageError"),
      imageCredit: document.querySelector("#imageCredit"),
      announcer: document.querySelector("#announcer"),
      currentButton: document.querySelector("#currentButton"),
      randomButton: document.querySelector("#randomButton")
    };

    let allOrganisms = [];
    let shuffledDeck = [];
    let currentOrganism = null;
    let renderRequestId = 0;
    const photoCache = new Map();

    function setControlsDisabled(disabled) {
      elements.currentButton.disabled = disabled;
      elements.randomButton.disabled = disabled;
    }

    function parseGoogleVisualizationResponse(text) {
      const start = text.indexOf("{");
      const end = text.lastIndexOf("}");

      if (start === -1 || end === -1) {
        throw new Error("The spreadsheet returned an unexpected response.");
      }

      return JSON.parse(text.slice(start, end + 1));
    }

    function cellValue(row, index, fallback = "—") {
      const value = row.c?.[index]?.v;
      return value === null || value === undefined || value === ""
        ? fallback
        : String(value).trim();
    }

    function rowsToOrganisms(rows) {
      return rows
        .filter(row => row?.c?.some(cell => cell?.v !== null && cell?.v !== undefined))
        .map(row => ({
          scientificName: cellValue(row, 0, "Scientific name unavailable"),
          commonName: cellValue(row, 1, "Unknown organism"),
          phylum: cellValue(row, 2),
          className: cellValue(row, 3),
          order: cellValue(row, 4),
          fact: cellValue(row, 5, "Scientific details are pending."),
          imageUrl: cellValue(row, 6, "")
        }))
        .filter(organism =>
          organism.commonName !== "Unknown organism" ||
          organism.scientificName !== "Scientific name unavailable"
        );
    }

    async function loadOrganisms() {
      const response = await fetch(DATA_URL, { cache: "no-store" });

      if (!response.ok) {
        throw new Error(`Spreadsheet request failed with status ${response.status}.`);
      }

      const text = await response.text();
      const data = parseGoogleVisualizationResponse(text);
      const organisms = rowsToOrganisms(data.table?.rows ?? []);

      if (organisms.length === 0) {
        throw new Error("No organism rows were found in the spreadsheet.");
      }

      return organisms;
    }

    function createNewDeck(excludeScientificName = "") {
      shuffledDeck = allOrganisms.filter(
        organism => organism.scientificName !== excludeScientificName
      );

      for (let i = shuffledDeck.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffledDeck[i], shuffledDeck[j]] = [shuffledDeck[j], shuffledDeck[i]];
      }
    }

    function mondayOf(date) {
      const monday = new Date(
        date.getFullYear(),
        date.getMonth(),
        date.getDate()
      );
      const offset = (monday.getDay() + 6) % 7;
      monday.setDate(monday.getDate() - offset);
      monday.setHours(0, 0, 0, 0);
      return monday;
    }

    function weeksSinceRotationStart(now = new Date()) {
      const start = mondayOf(new Date(`${ROTATION_START}T00:00:00`));
      const currentMonday = mondayOf(now);
      return Math.floor((currentMonday - start) / (7 * 86400000));
    }

    function getIsoWeek(date = new Date()) {
      const utcDate = new Date(Date.UTC(
        date.getFullYear(),
        date.getMonth(),
        date.getDate()
      ));

      const dayNumber = utcDate.getUTCDay() || 7;
      utcDate.setUTCDate(utcDate.getUTCDate() + 4 - dayNumber);

      const yearStart = new Date(Date.UTC(utcDate.getUTCFullYear(), 0, 1));
      const week = Math.ceil((((utcDate - yearStart) / 86400000) + 1) / 7);

      return {
        week,
        weekYear: utcDate.getUTCFullYear()
      };
    }

    async function getWikipediaImage(name) {
      if (!name) return null;
      if (photoCache.has(name)) return photoCache.get(name);

      const params = new URLSearchParams({
        action: "query",
        format: "json",
        origin: "*",
        prop: "pageimages|info",
        inprop: "url",
        titles: name,
        pithumbsize: "1200",
        redirects: "1"
      });

      let result = null;

      try {
        const response = await fetch(
          `https://en.wikipedia.org/w/api.php?${params.toString()}`
        );

        if (!response.ok) {
          throw new Error("Wikipedia image request failed.");
        }

        const data = await response.json();
        const page = Object.values(data.query?.pages ?? {})[0];

        if (page?.thumbnail?.source) {
          result = {
            src: page.thumbnail.source,
            pageUrl: page.fullurl || "",
            pageTitle: page.title || name
          };
        }
      } catch (error) {
        console.warn(error);
      }

      photoCache.set(name, result);
      return result;
    }

    function testImage(url) {
      return new Promise(resolve => {
        const probe = new Image();
        probe.onload = () => resolve(true);
        probe.onerror = () => resolve(false);
        probe.src = url;
      });
    }

    function displayImage(source, altText, requestId) {
      if (requestId !== renderRequestId) return;

      elements.image.onload = () => {
        if (requestId !== renderRequestId) return;
        elements.image.classList.add("is-loaded");
        elements.loader.hidden = true;
        elements.imageError.hidden = true;
      };

      elements.image.alt = altText;
      elements.image.src = source.src;

      elements.imageCredit.textContent = "";
      elements.imageCredit.hidden = true;

      if (source.pageUrl) {
        const link = document.createElement("a");
        link.href = source.pageUrl;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "Wikipedia";
        elements.imageCredit.append("Image source: ", link);
        elements.imageCredit.hidden = false;
      }
    }

    async function render(organism) {
      const requestId = ++renderRequestId;
      currentOrganism = organism;

      elements.image.classList.remove("is-loaded");
      elements.image.removeAttribute("src");
      elements.image.alt = "";
      elements.imageCredit.hidden = true;
      elements.imageCredit.textContent = "";
      elements.loader.hidden = false;
      elements.imageError.hidden = true;

      elements.name.textContent = organism.commonName;
      elements.scientificName.textContent = organism.scientificName;
      elements.phylum.textContent = organism.phylum;
      elements.className.textContent = organism.className;
      elements.order.textContent = organism.order;
      elements.fact.textContent = organism.fact;
      elements.announcer.textContent =
        `Now showing ${organism.commonName}, ${organism.scientificName}.`;

      const altText =
        `${organism.commonName} (${organism.scientificName}), featured marine organism`;

      const candidates = [];

      if (organism.imageUrl) {
        candidates.push({ src: organism.imageUrl, pageUrl: "" });
      }

      const wikiScientific = await getWikipediaImage(organism.scientificName);
      if (requestId !== renderRequestId) return;

      if (wikiScientific && !candidates.some(item => item.src === wikiScientific.src)) {
        candidates.push(wikiScientific);
      }

      if (!wikiScientific) {
        const wikiCommon = await getWikipediaImage(organism.commonName);
        if (requestId !== renderRequestId) return;

        if (wikiCommon && !candidates.some(item => item.src === wikiCommon.src)) {
          candidates.push(wikiCommon);
        }
      }

      candidates.push({ src: PLACEHOLDER_IMAGE, pageUrl: "", placeholder: true });

      for (const source of candidates) {
        if (requestId !== renderRequestId) return;

        const loaded = await testImage(source.src);
        if (requestId !== renderRequestId) return;

        if (loaded) {
          displayImage(
            source,
            source.placeholder
              ? `No photo available for ${organism.commonName}`
              : altText,
            requestId
          );
          return;
        }
      }

      if (requestId === renderRequestId) {
        elements.loader.hidden = true;
        elements.imageError.hidden = false;
      }
    }

    function showCurrent() {
      if (allOrganisms.length === 0) return;

      const elapsedWeeks = weeksSinceRotationStart();
      const index =
        ((elapsedWeeks % allOrganisms.length) + allOrganisms.length) %
        allOrganisms.length;

      elements.badge.classList.remove("status-error");
      elements.badge.textContent =
        `Weekly Rotation · ${index + 1} of ${allOrganisms.length}`;

      render(allOrganisms[index]);
    }

    function randomize() {
      if (allOrganisms.length === 0) return;

      if (shuffledDeck.length === 0) {
        createNewDeck(currentOrganism?.scientificName ?? "");
      }

      const nextOrganism = shuffledDeck.pop();

      if (!nextOrganism) {
        showCurrent();
        return;
      }

      elements.badge.classList.remove("status-error");
      elements.badge.textContent = "Observation Mode";
      render(nextOrganism);
    }

    async function init() {
      setControlsDisabled(true);

      try {
        allOrganisms = await loadOrganisms();
        showCurrent();
        createNewDeck(currentOrganism?.scientificName ?? "");
      } catch (error) {
        console.error(error);
        elements.badge.textContent = "Data unavailable";
        elements.badge.classList.add("status-error");
        elements.name.textContent = "Unable to load organisms";
        elements.scientificName.textContent = "Check the spreadsheet sharing settings";
        elements.fact.textContent =
          "Make sure the Google Sheet is shared as “Anyone with the link can view,” then reload this page.";
        elements.loader.hidden = true;
        elements.imageError.hidden = false;
      } finally {
        setControlsDisabled(allOrganisms.length === 0);
      }
    }

    elements.currentButton.addEventListener("click", showCurrent);
    elements.randomButton.addEventListener("click", randomize);

    init();
  </script>
</body>
</html>
